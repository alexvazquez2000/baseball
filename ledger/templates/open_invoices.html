{% extends "base.html" %}
{% block content %}
<h2>Open Invoices</h2>
<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Customer</th>
            <th>Total Invoiced</th>
            <th>Total Paid</th>
            <th>Balance</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <td>{{ row.last_name }}</td>
            <td>${{ "%.2f"|format(row.invoiced) }}</td>
            <td>${{ "%.2f"|format(row.paid) }}</td>
            <td>${{ "%.2f"|format(row.invoiced - row.paid) }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
