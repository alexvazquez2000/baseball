{% extends 'base.html' %}
{% block content %}
<h2>Edit Team</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label for="name" class="form-label">Team Name</label>
    <input type="text" name="teamName" class="form-control" value="{{ team.teamName }}" required />
  </div>
  <div class="mb-3">
    <label for="season_name" class="form-label">Season :
        <input type="text" name="season_name" value="{{ team.season.season_name }}" disabled="disabled" />
    </label>
  </div>

  <div class="mb-3">
    <label for="level" class="form-label">Group Level</label>
    <select name="level_id" class="form-select" aria-label="Group Level">
      {% for level in levels %}
        <option value="{{ level.id }}" {% if team.level.id == level.id %}selected{% endif %}>
          {{level.level_name }}
        </option>
      {% endfor %}
    </select>
  </div>

  <input type="submit" name="save" id="save" value="Save" class="btn btn-primary">
  <a href="{{ url_for('seasons.list_teams') }}" class="btn btn-secondary">Cancel</a>
</form>

  <div class="mb-3">
    <label for="coaches" class="form-label">Coaches</label>
    <select name="coaches" class="form-select" multiple size="5">
      {% for coach in team.coaches %}
        <option value="{{ coach.id }}" {% if coach in team.coaches %}selected{% endif %}>
          {{ coach.first_name }} {{ coach.last_name }}
        </option>
      {% endfor %}
    </select>
    <small class="form-text text-muted">Hold Ctrl (Cmd on Mac) to select multiple.</small>
  </div>

  <div class="mb-3">
    <label for="players" class="form-label">Players</label>
    <select name="players" class="form-select" multiple size="5">
      {% for player in team.players %}
        <option value="{{ player.id }}" {% if player in team.players %}selected{% endif %}>
          {{ player.first_name }} {{ player.last_name }}
        </option>
      {% endfor %}
    </select>
    <small class="form-text text-muted">Hold Ctrl (Cmd on Mac) to select multiple.</small>
  </div>

{% endblock %}
